{id:'p22',title:'Minimum Tents (เต็นท์ต้องเต็มพอดี)',pattern:'DP แบบ coin change',lv:'I',fn:'minTents',
 desc:'มีเต็นท์หลายขนาด s[i] = จำนวนคนที่นอนได้ (แต่ละขนาดมีไม่จำกัด) และมีคน r คน ทุกหลังที่กางต้องนอนเต็มพอดี\nจงหาจำนวนเต็นท์ "น้อยที่สุด" ที่ทำให้ทุกคนมีที่นอนพอดี ถ้าจัดไม่ได้ให้คืน -1 (r = 0 คืน 0)\nตัวอย่าง: r = 10, s = [3, 5] → 2 (5+5) · r = 7, s = [2, 4] → -1',
 starter:'function minTents(r, s) {\n  \n}',
 tests:[{args:[10,[3,5]],expected:2},{args:[7,[2,4]],expected:-1},{args:[11,[1,5,6]],expected:2},{args:[0,[2,3]],expected:0},{args:[13,[4,6,9]],expected:2},{args:[7,[4,6]],expected:-1},{args:[12,[5,4]],expected:3},{args:[100,[7,13,1]],expected:10},{n:'Performance: r = 100,000, 50 ขนาด',gen:'tents-big',maxMs:1500}],
 hint:'dp[i] = จำนวนเต็นท์น้อยสุดที่จัดคนได้พอดี i คน (dp[0] = 0, ที่เหลือเริ่มเป็น -1 = ทำไม่ได้)\nสำหรับทุก i และทุกขนาด sz: ถ้า i ≥ sz และ dp[i−sz] ≥ 0 ให้ dp[i] = min(dp[i], dp[i−sz] + 1)\nระวัง greedy (เลือกหลังใหญ่สุดก่อน) ใช้ไม่ได้ เช่น r=12, s=[5,4] greedy ได้ 5+5 แล้วเหลือ 2 จัดไม่ได้ แต่คำตอบคือ 4+4+4',
 sol:'function minTents(r, s) {\n  const dp = new Array(r + 1).fill(-1);\n  dp[0] = 0;\n  for (let i = 1; i <= r; i++) {\n    for (const sz of s) {\n      if (i >= sz && dp[i - sz] >= 0) {\n        dp[i] = dp[i] < 0 ? dp[i - sz] + 1 : Math.min(dp[i], dp[i - sz] + 1);\n      }\n    }\n  }\n  return dp[r];\n}',
 cs:'public static int MinTents(int r, int[] s)\n{\n    var dp = new int[r + 1];\n    Array.Fill(dp, -1);\n    dp[0] = 0;\n    for (int i = 1; i <= r; i++)\n        foreach (var sz in s)\n            if (i >= sz && dp[i - sz] >= 0)\n                dp[i] = dp[i] < 0 ? dp[i - sz] + 1 : Math.Min(dp[i], dp[i - sz] + 1);\n    return dp[r];\n}',
 cx:'O(r × k) เมื่อ k = จำนวนขนาดเต็นท์'},

{id:'p23',title:'Minimum Tents (จุได้อย่างน้อย r คน)',pattern:'DP (ปัดค่าลบเป็น 0)',lv:'I',fn:'minTentsAtLeast',
 desc:'เหมือนข้อก่อน แต่เต็นท์ไม่จำเป็นต้องนอนเต็ม — ต้องการให้ความจุรวม "อย่างน้อย" r คน โดยใช้เต็นท์น้อยที่สุด (แต่ละขนาดมีไม่จำกัด) ถ้า s ว่างหรือ r ≤ 0 ให้คืน 0 เมื่อ r ≤ 0 และ -1 เมื่อ s ว่างแต่ r > 0\nตัวอย่าง: r = 7, s = [2, 4] → 2 (4+4 จุ 8) · r = 10, s = [3] → 4',
 starter:'function minTentsAtLeast(r, s) {\n  \n}',
 tests:[{args:[7,[2,4]],expected:2},{args:[10,[3]],expected:4},{args:[0,[5]],expected:0},{args:[5,[]],expected:-1},{args:[9,[4,6]],expected:2},{args:[1,[10,3]],expected:1},{args:[23,[5,10,12]],expected:2}],
 hint:'วิธีที่ง่ายสุด: ใช้เต็นท์ขนาดใหญ่สุดอย่างเดียว ceil(r / max) ก็ได้คำตอบน้อยที่สุดแล้ว เพราะไม่ต้องนอนเต็ม\n(ถ้าข้อสอบห้ามเกินหรือคิดค่าใช้จ่ายต่างกัน ค่อยใช้ DP: dp[i] = min(dp[max(0, i−sz)] + 1))',
 sol:'function minTentsAtLeast(r, s) {\n  if (r <= 0) return 0;\n  if (!s.length) return -1;\n  const big = Math.max(...s);\n  return Math.ceil(r / big);\n}',
 cs:'public static int MinTentsAtLeast(int r, int[] s)\n{\n    if (r <= 0) return 0;\n    if (s.Length == 0) return -1;\n    int big = s.Max();\n    return (r + big - 1) / big;   // ceil โดยไม่ใช้ double\n}',
 cx:'O(k)'},

{id:'p24',title:'FizzBuzz',pattern:'Loop + modulo (ลำดับเงื่อนไขสำคัญ)',lv:'B',fn:'fizzBuzz',
 desc:'คืน array ของข้อความสำหรับ i = 1..n: "FizzBuzz" ถ้าหารด้วย 3 และ 5 ลงตัว, "Fizz" ถ้าหารด้วย 3 ลงตัวอย่างเดียว, "Buzz" ถ้าหารด้วย 5 ลงตัวอย่างเดียว, ไม่งั้นเป็นตัวเลข i (เป็นข้อความ)\nใน HackerRank ภาษา C# มักให้ "พิมพ์" ทีละบรรทัดด้วย Console.WriteLine แทนการคืนค่า',
 starter:'function fizzBuzz(n) {\n  \n}',
 tests:[{args:[15],expected:['1','2','Fizz','4','Buzz','Fizz','7','8','Fizz','Buzz','11','Fizz','13','14','FizzBuzz']},{args:[1],expected:['1']},{args:[5],expected:['1','2','Fizz','4','Buzz']},{args:[0],expected:[]}],
 hint:'ตรวจ "หารด้วย 15" ก่อนเสมอ ถ้าตรวจ 3 ก่อนจะได้ Fizz แทน FizzBuzz',
 sol:'function fizzBuzz(n) {\n  const out = [];\n  for (let i = 1; i <= n; i++) {\n    if (i % 15 === 0) out.push("FizzBuzz");\n    else if (i % 3 === 0) out.push("Fizz");\n    else if (i % 5 === 0) out.push("Buzz");\n    else out.push(String(i));\n  }\n  return out;\n}',
 cs:'// แบบ HackerRank (พิมพ์): for (int i = 1; i <= n; i++) Console.WriteLine(...)\npublic static List<string> FizzBuzz(int n)\n{\n    var res = new List<string>();\n    for (int i = 1; i <= n; i++)\n        res.Add(i % 15 == 0 ? "FizzBuzz" : i % 3 == 0 ? "Fizz" : i % 5 == 0 ? "Buzz" : i.ToString());\n    return res;\n}',
 cx:'O(n)'},

{id:'p25',title:'Most Accessed File',pattern:'Parse + aggregate (Dictionary)',lv:'I',fn:'mostAccessedFile',
 desc:'ได้รายการบรรทัดรูปแบบ "<ชื่อไฟล์> - Accessed <N> times" (ไฟล์เดียวกันอาจปรากฏหลายบรรทัด) คืนข้อความ "<ชื่อไฟล์>,<จำนวนรวม>" ของไฟล์ที่ถูกเปิดรวมมากที่สุด ถ้าเสมอให้เลือกไฟล์ที่ปรากฏก่อน ถ้าไม่มีบรรทัดเลยคืน ""\n(โจทย์เดียวกับ Prompt Coding "File Access Data" แต่เขียนเป็นโค้ด)',
 starter:'function mostAccessedFile(lines) {\n  \n}',
 tests:[{args:[['Document1.pdf - Accessed 5 times','Presentation.pptx - Accessed 3 times','Spreadsheet.xlsx - Accessed 7 times','Document1.pdf - Accessed 4 times']],expected:'Document1.pdf,9'},{args:[['a.txt - Accessed 1 times']],expected:'a.txt,1'},{args:[['x.doc - Accessed 2 times','y.doc - Accessed 2 times']],expected:'x.doc,2'},{args:[[]],expected:''},{args:[['my file.pdf - Accessed 10 times','b.pdf - Accessed 3 times','b.pdf - Accessed 8 times']],expected:'b.pdf,11'}],
 hint:'แยกด้วย " - Accessed " (ชื่อไฟล์อาจมีช่องว่าง) แล้วดึงตัวเลข เก็บผลรวมใน Map ที่จำลำดับการเจอครั้งแรก เลือกค่าสูงสุดโดยใช้ > (ไม่ใช่ >=) เพื่อให้ตัวที่มาก่อนชนะเมื่อเสมอ',
 sol:'function mostAccessedFile(lines) {\n  const total = new Map();\n  for (const line of lines) {\n    const idx = line.lastIndexOf(" - Accessed ");\n    const name = line.slice(0, idx);\n    const n = parseInt(line.slice(idx + 12), 10);\n    total.set(name, (total.get(name) || 0) + n);\n  }\n  let best = "", bestN = -1;\n  for (const [name, n] of total) if (n > bestN) { best = name; bestN = n; }\n  return bestN < 0 ? "" : best + "," + bestN;\n}',
 cs:'public static string MostAccessedFile(string[] lines)\n{\n    var total = new Dictionary<string, int>();\n    var order = new List<string>();\n    foreach (var line in lines)\n    {\n        int idx = line.LastIndexOf(" - Accessed ");\n        var name = line[..idx];\n        int n = int.Parse(line[(idx + 12)..].Split(\' \')[0]);\n        if (!total.ContainsKey(name)) { total[name] = 0; order.Add(name); }\n        total[name] += n;\n    }\n    if (order.Count == 0) return "";\n    var best = order[0];\n    foreach (var name in order) if (total[name] > total[best]) best = name;\n    return $"{best},{total[best]}";\n}',
 cx:'O(n)'},

{id:'p26',title:'String Compression',pattern:'Run-length encoding',lv:'B',fn:'compress',
 desc:'บีบอัดข้อความโดยแทนตัวอักษรที่ซ้ำติดกันด้วย ตัวอักษร + จำนวนครั้ง เช่น "aaabbc" → "a3b2c1" ข้อความว่างคืน ""',
 starter:'function compress(s) {\n  \n}',
 tests:[{args:['aaabbc'],expected:'a3b2c1'},{args:['a'],expected:'a1'},{args:[''],expected:''},{args:['abab'],expected:'a1b1a1b1'},{args:['zzzzzzzzzzzz'],expected:'z12'}],
 hint:'เดินทีละตัว นับต่อไปเรื่อย ๆ จนตัวถัดไปไม่เหมือนเดิม แล้วต่อผล (ใช้ array แล้ว join ดีกว่าต่อ string ใน loop)',
 sol:'function compress(s) {\n  const out = [];\n  for (let i = 0; i < s.length; ) {\n    let j = i;\n    while (j < s.length && s[j] === s[i]) j++;\n    out.push(s[i] + (j - i));\n    i = j;\n  }\n  return out.join("");\n}',
 cs:'public static string Compress(string s)\n{\n    var sb = new System.Text.StringBuilder();\n    for (int i = 0; i < s.Length; )\n    {\n        int j = i;\n        while (j < s.Length && s[j] == s[i]) j++;\n        sb.Append(s[i]).Append(j - i);\n        i = j;\n    }\n    return sb.ToString();\n}',
 cx:'O(n)'},

{id:'p27',title:'Second Largest Distinct',pattern:'One pass',lv:'B',fn:'secondLargest',
 desc:'คืนค่าที่มากเป็นอันดับสองแบบไม่นับค่าซ้ำ ถ้าไม่มี (มีค่าต่างกันน้อยกว่า 2 ค่า) คืน -1\nตัวอย่าง: [5, 1, 5, 3] → 3 · [4, 4] → -1',
 starter:'function secondLargest(nums) {\n  \n}',
 tests:[{args:[[5,1,5,3]],expected:3},{args:[[4,4]],expected:-1},{args:[[1,2]],expected:1},{args:[[]],expected:-1},{args:[[-3,-1,-2]],expected:-2},{args:[[10,9,10,8,9]],expected:9}],
 hint:'เก็บ first และ second เดินรอบเดียว: x > first → second = first, first = x · ถ้า x < first และ x > second → second = x (ข้าม x == first)',
 sol:'function secondLargest(nums) {\n  let first = -Infinity, second = -Infinity;\n  for (const x of nums) {\n    if (x > first) { second = first; first = x; }\n    else if (x < first && x > second) second = x;\n  }\n  return second === -Infinity ? -1 : second;\n}',
 cs:'public static int SecondLargest(int[] nums)\n{\n    long first = long.MinValue, second = long.MinValue;\n    foreach (var x in nums)\n    {\n        if (x > first) { second = first; first = x; }\n        else if (x < first && x > second) second = x;\n    }\n    return second == long.MinValue ? -1 : (int)second;\n}',
 cx:'O(n)'},

{id:'p28',title:'Staircase',pattern:'String building (HackerRank warm-up)',lv:'B',fn:'staircase',
 desc:'คืน array ของบรรทัดที่วาดบันไดสูง n ชั้น ชิดขวา ใช้ช่องว่างและ "#" เช่น n = 4 → ["   #","  ##"," ###","####"]',
 starter:'function staircase(n) {\n  \n}',
 tests:[{args:[4],expected:['   #','  ##',' ###','####']},{args:[1],expected:['#']},{args:[2],expected:[' #','##']}],
 hint:'บรรทัดที่ i (เริ่ม 1) = ช่องว่าง n−i ตัว ตามด้วย # i ตัว — ระวังช่องว่างท้ายบรรทัด (ห้ามมี)',
 sol:'function staircase(n) {\n  const out = [];\n  for (let i = 1; i <= n; i++) out.push(" ".repeat(n - i) + "#".repeat(i));\n  return out;\n}',
 cs:'public static List<string> Staircase(int n)\n{\n    var res = new List<string>();\n    for (int i = 1; i <= n; i++) res.Add(new string(\' \', n - i) + new string(\'#\', i));\n    return res;\n}',
 cx:'O(n²) ตามขนาดผลลัพธ์'},

{id:'p29',title:'Plus Minus',pattern:'Ratio + format ทศนิยม (HackerRank warm-up)',lv:'B',fn:'plusMinus',
 desc:'คืน array 3 ข้อความ: สัดส่วนของจำนวนบวก, ลบ, ศูนย์ ในรูปทศนิยม 6 ตำแหน่ง\nตัวอย่าง: [-4, 3, -9, 0, 4, 1] → ["0.500000","0.333333","0.166667"]',
 starter:'function plusMinus(arr) {\n  \n}',
 tests:[{args:[[-4,3,-9,0,4,1]],expected:['0.500000','0.333333','0.166667']},{args:[[1,1,0,-1,-1]],expected:['0.400000','0.400000','0.200000']},{args:[[0]],expected:['0.000000','0.000000','1.000000']}],
 hint:'นับสามกลุ่ม แล้วหารด้วยความยาว ใช้ toFixed(6) (C#: ToString("F6")) — ระวังการหารแบบจำนวนเต็มใน C# ต้องแปลงเป็น double ก่อน',
 sol:'function plusMinus(arr) {\n  const n = arr.length;\n  const pos = arr.filter(x => x > 0).length, neg = arr.filter(x => x < 0).length;\n  return [pos, neg, n - pos - neg].map(c => (c / n).toFixed(6));\n}',
 cs:'public static List<string> PlusMinus(int[] arr)\n{\n    double n = arr.Length;\n    int pos = arr.Count(x => x > 0), neg = arr.Count(x => x < 0);\n    return new List<string> { (pos / n).ToString("F6"), (neg / n).ToString("F6"), ((n - pos - neg) / n).ToString("F6") };\n}',
 cx:'O(n)'},

{id:'p30',title:'Mini-Max Sum',pattern:'Sum − max/min (ระวัง overflow)',lv:'B',fn:'miniMaxSum',
 desc:'มีจำนวนเต็มบวก 5 ตัว คืน [ผลรวมน้อยสุด, ผลรวมมากสุด] ของการเลือก 4 ตัวจาก 5 ตัว (ค่าแต่ละตัวอาจถึง 10⁹ — ผลรวมเกิน int ใน C#)\nตัวอย่าง: [1,2,3,4,5] → [10, 14]',
 starter:'function miniMaxSum(arr) {\n  \n}',
 tests:[{args:[[1,2,3,4,5]],expected:[10,14]},{args:[[7,69,2,221,8974]],expected:[299,9271]},{args:[[5,5,5,5,5]],expected:[20,20]},{args:[[1000000000,1000000000,1000000000,1000000000,1000000000]],expected:[4000000000,4000000000]}],
 hint:'ผลรวมทั้งหมด − ค่ามากสุด = น้อยสุด, ผลรวม − ค่าน้อยสุด = มากสุด · ใน C# ใช้ long',
 sol:'function miniMaxSum(arr) {\n  const sum = arr.reduce((a, b) => a + b, 0);\n  return [sum - Math.max(...arr), sum - Math.min(...arr)];\n}',
 cs:'public static long[] MiniMaxSum(int[] arr)\n{\n    long sum = arr.Sum(x => (long)x);\n    return new[] { sum - arr.Max(), sum - arr.Min() };\n}',
 cx:'O(n)'}
);

{t:'ยอดขายตามหมวด (PAID เท่านั้น)',lv:'B',d:'แสดง category, revenue (= SUM(qty × unit_price)) เฉพาะ order ที่ status = \'PAID\' เรียง revenue มากไปน้อย',

 ref:"WITH spend AS (\n  SELECT c.name, SUM(i.qty * i.unit_price) AS spent\n  FROM customers c\n  JOIN orders o ON o.customer_id = c.id AND o.status = 'PAID'\n  JOIN order_items i ON i.order_id = o.id\n  GROUP BY c.id, c.name)\nSELECT name, spent FROM spend\nWHERE spent > (SELECT AVG(spent) FROM spend)\nORDER BY spent DESC;"},
{t:'สินค้าขายดีอันดับ 1 ของแต่ละหมวด (top-N per group)',lv:'I',d:'จาก order ที่ PAID แสดง category, name, revenue ของสินค้าที่ revenue สูงสุดในแต่ละหมวด (ถ้าเท่ากันเลือก name ที่มาก่อนตามตัวอักษร) เรียงตาม category',
 ref:"WITH s AS (\n  SELECT p.category, p.name, SUM(i.qty * i.unit_price) AS revenue,\n         ROW_NUMBER() OVER (PARTITION BY p.category ORDER BY SUM(i.qty * i.unit_price) DESC, p.name) AS rn\n  FROM order_items i\n  JOIN orders o ON o.id = i.order_id AND o.status = 'PAID'\n  JOIN products p ON p.id = i.product_id\n  GROUP BY p.category, p.name)\nSELECT category, name, revenue FROM s WHERE rn = 1 ORDER BY category;"},
{t:'ยอดรายเดือน + ยอดสะสม + เทียบเดือนก่อน',lv:'I',d:'จาก order ที่ PAID แสดง month (\'YYYY-MM\' ใช้ substr(order_date,1,7)), revenue, running_total, diff_prev (revenue − เดือนก่อน, เดือนแรกเป็น NULL) เรียงตาม month',

{t:'สายบังคับบัญชา (Recursive CTE)',lv:'A',d:'แสดง name, lvl (CEO = 0 คือคนที่ manager_id เป็น NULL), manager_name (CEO เป็น NULL) ของพนักงานทุกคน เรียง lvl แล้ว name',

{t:'อัตราซื้อซ้ำต่อเมือง',lv:'A',d:'ต่อเมือง (city) แสดง city, customers (จำนวนลูกค้าทั้งหมดในเมือง), repeat_buyers (ลูกค้าที่มี order PAID ≥ 2 ครั้ง) เรียง repeat_buyers มากไปน้อย แล้ว city — เมืองที่ไม่มีคนซื้อซ้ำต้องแสดง 0',
 ref:"WITH paid AS (\n  SELECT customer_id, COUNT(*) AS n FROM orders WHERE status = 'PAID' GROUP BY customer_id)\nSELECT c.city, COUNT(*) AS customers,\n       SUM(CASE WHEN COALESCE(p.n, 0) >= 2 THEN 1 ELSE 0 END) AS repeat_buyers\nFROM customers c LEFT JOIN paid p ON p.customer_id = c.id\nGROUP BY c.city\nORDER BY repeat_buyers DESC, c.city;"}

const PROMPT_TASKS = [
{id:'pt1',title:'แปลงข้อความระยะเวลาเป็นนาที',fn:'parseDuration',params:'text',
 spec:'ฟังก์ชัน parseDuration(text) คืนจำนวนนาทีรวม (จำนวนเต็ม) หรือ -1 ถ้ารูปแบบไม่ถูกต้อง\n1) ข้อความประกอบด้วยส่วน "ชั่วโมง" และ/หรือ "นาที" อย่างละไม่เกินหนึ่งครั้ง ถ้ามีทั้งคู่ ชั่วโมงต้องมาก่อน\n2) แต่ละส่วนคือตัวเลขตามด้วยหน่วย ระหว่างตัวเลขกับหน่วยมีช่องว่างได้ และระหว่างสองส่วนมีช่องว่างได้\n3) หน่วยชั่วโมง: h, hr, hrs, ชม., ชั่วโมง · หน่วยนาที: m, min, mins, นาที (หน่วยอังกฤษไม่สนตัวพิมพ์ใหญ่เล็ก)\n4) ชั่วโมงเป็นทศนิยมได้ (1.5h = 90) แต่ผลรวมต้องเป็นจำนวนนาทีเต็ม ไม่งั้นคืน -1 (1.01h → -1) · นาทีต้องเป็นจำนวนเต็ม\n5) ช่องว่างหน้า/หลังข้อความไม่มีผล · ข้อความว่างหรือมีส่วนอื่นปน คืน -1',
 tests:[
  {n:'ชั่วโมงและนาที',args:['1h 30m'],expected:90},{n:'นาทีอย่างเดียว',args:['45min'],expected:45},{n:'ทศนิยมชั่วโมง',args:['1.5h'],expected:90},{n:'ภาษาไทย',args:['2 ชั่วโมง 15 นาที'],expected:135},
  {n:'ไม่มีช่องว่าง',args:['2h15m'],expected:135},{n:'ตัวพิมพ์ใหญ่',args:['3 HRS'],expected:180},{n:'ชม. แบบย่อ',args:['1ชม. 5นาที'],expected:65},{n:'ช่องว่างหน้าหลัง',args:['  20 mins '],expected:20},
  {n:'ทศนิยมได้นาทีไม่เต็ม',args:['1.01h'],expected:-1},{n:'นาทีเป็นทศนิยม',args:['1.5m'],expected:-1},{n:'สลับลำดับ',args:['30m 1h'],expected:-1},{n:'หน่วยซ้ำ',args:['1h 2h'],expected:-1},
  {n:'ข้อความว่าง',args:[''],expected:-1},{n:'มีคำอื่นปน',args:['about 1h'],expected:-1},{n:'ไม่มีหน่วย',args:['90'],expected:-1},{n:'ศูนย์นาที',args:['0m'],expected:0}],
 sol:"function parseDuration(text) {\n  const t = text.trim();\n  const re = /^(?:(\\d+(?:\\.\\d+)?)\\s*(hrs|hr|h|ชม\\.|ชั่วโมง))?\\s*(?:(\\d+)\\s*(mins|min|m|นาที))?$/i;\n  const m = t.match(re);\n  if (!t || !m || (m[1] === undefined && m[3] === undefined)) return -1;\n  const total = (m[1] ? Number(m[1]) * 60 : 0) + (m[3] ? Number(m[3]) : 0);\n  const rounded = Math.round(total);\n  return Math.abs(total - rounded) < 1e-9 ? rounded : -1;\n}",
 sample:'เขียนฟังก์ชัน parseDuration(text) แปลงข้อความระยะเวลาเป็นจำนวนนาทีรวม (จำนวนเต็ม) ถ้ารูปแบบผิดให้คืน -1\nกติกา:\n1. ตัดช่องว่างหน้าและหลังข้อความก่อน ถ้าเหลือข้อความว่างคืน -1\n2. ข้อความต้องประกอบด้วยส่วนชั่วโมงและ/หรือส่วนนาทีเท่านั้น อย่างละไม่เกินหนึ่งครั้ง ถ้ามีทั้งสองส่วน ส่วนชั่วโมงต้องอยู่ก่อนส่วนนาที ห้ามมีคำอื่นปน\n3. แต่ละส่วน = ตัวเลขแล้วตามด้วยหน่วย ระหว่างตัวเลขกับหน่วยจะมีช่องว่างหรือไม่มีก็ได้ ระหว่างสองส่วนก็มีช่องว่างหรือไม่มีก็ได้\n4. หน่วยชั่วโมงที่รับ: h, hr, hrs, ชม. (มีจุด), ชั่วโมง หน่วยนาทีที่รับ: m, min, mins, นาที หน่วยภาษาอังกฤษไม่สนตัวพิมพ์ใหญ่เล็ก\n5. ตัวเลขชั่วโมงเป็นทศนิยมได้ ตัวเลขนาทีต้องเป็นจำนวนเต็มเท่านั้น\n6. ผลรวม = ชั่วโมง × 60 + นาที ถ้าผลรวมไม่ใช่จำนวนเต็มให้คืน -1\nตัวอย่าง: "1h 30m" → 90, "2h15m" → 135, "1ชม. 5นาที" → 65, "3 HRS" → 180, "1.5h" → 90, "0m" → 0\nตัวอย่างที่ต้องคืน -1: "1.01h", "1.5m", "30m 1h", "1h 2h", "about 1h", "90", ""'},
{id:'pt2',title:'ตรวจเลขบัตรประชาชนไทย',fn:'isValidThaiId',params:'id',
 spec:'ฟังก์ชัน isValidThaiId(id) คืน true/false\n1) รับได้ 2 รูปแบบ: ตัวเลข 13 หลักติดกัน หรือรูปแบบมีขีด 1-2345-67890-12-3 (กลุ่ม 1-4-5-2-1 หลัก) เท่านั้น ห้ามมีช่องว่างหรืออักขระอื่น\n2) checksum: ให้ d1..d13 คือเลขแต่ละหลัก คำนวณ sum = d1×13 + d2×12 + … + d12×2 แล้ว check = (11 − (sum mod 11)) mod 10 ถูกต้องเมื่อ check = d13\n3) หลักแรกต้องไม่ใช่ 0\nตัวอย่างเลขที่ถูก: 1101700203450, 3700100123455',
 tests:[
  {n:'เลขถูก (11 − เศษ = 10 → 0)',args:['1101700203450'],expected:true},{n:'เลขถูกแบบมีขีด',args:['1-1017-00203-45-0'],expected:true},{n:'checksum ผิด',args:['1101700203451'],expected:false},
  {n:'เลขถูกอีกชุด',args:['3700100123455'],expected:true},{n:'ขีดผิดตำแหน่ง',args:['11-017-00203-45-0'],expected:false},{n:'12 หลัก',args:['110170020345'],expected:false},
  {n:'14 หลัก',args:['11017002034500'],expected:false},{n:'มีช่องว่าง',args:['1 1017 00203 45 0'],expected:false},{n:'ขึ้นต้นด้วย 0',args:['0000000000001'],expected:false},
  {n:'มีตัวอักษร',args:['110170020345A'],expected:false},{n:'ข้อความว่าง',args:[''],expected:false},{n:'เลขถูก (11 − เศษ = 11 → 1)',args:['3100000071271'],expected:true}],
 sol:"function isValidThaiId(id) {\n  if (!/^(\\d{13}|\\d-\\d{4}-\\d{5}-\\d{2}-\\d)$/.test(id)) return false;\n  const d = id.replace(/-/g, '').split('').map(Number);\n  if (d[0] === 0) return false;\n  let sum = 0;\n  for (let i = 0; i < 12; i++) sum += d[i] * (13 - i);\n  return (11 - (sum % 11)) % 10 === d[12];\n}",
 sample:'เขียนฟังก์ชัน isValidThaiId(id) รับข้อความ คืน true ถ้าเป็นเลขบัตรประชาชนไทยที่ถูกต้อง ไม่งั้นคืน false\nกติกา:\n1. รูปแบบที่รับมีสองแบบเท่านั้น: ตัวเลข 13 หลักติดกัน หรือแบบมีขีดที่แบ่งกลุ่มเป็น 1, 4, 5, 2, 1 หลักตามลำดับ (เช่น 1-1017-00203-45-0) รูปแบบอื่น เช่น ขีดผิดตำแหน่ง มีช่องว่าง มีตัวอักษร หลักขาดหรือเกิน ให้คืน false\n2. นำตัวเลข 13 หลักมาตรวจ หลักแรกต้องไม่ใช่ 0\n3. คูณหลักที่ 1 ถึง 12 ด้วย 13, 12, 11, ... ลงไปจนถึง 2 ตามลำดับ แล้วรวมกัน\n4. นำผลรวมหารด้วย 11 เอาเศษ แล้วเอา 11 ลบเศษนั้น จากนั้นหารด้วย 10 เอาเศษ (เช่น ถ้าได้ 10 จะเหลือ 0 ถ้าได้ 11 จะเหลือ 1)\n5. ค่าที่ได้ต้องเท่ากับหลักที่ 13 จึงถือว่าถูกต้อง\nตัวอย่าง: "1101700203450" → true, "1-1017-00203-45-0" → true, "3700100123455" → true, "1101700203451" → false, "11-017-00203-45-0" → false, "1 1017 00203 45 0" → false, "0000000000001" → false'}
];

/* ================= SQL LAB — โจทย์เพิ่ม (ข้อ 11–20) ใช้ฐานข้อมูลร้านค้าเดิม ================= */
SQL_EX.push(
{t:'ลูกค้าที่ยังไม่เคยจ่ายเงินเลย (NOT EXISTS)',lv:'I',d:'แสดง name ของลูกค้าที่ไม่มี order สถานะ PAID เลย (รวมคนที่มีแต่ order สถานะอื่น และคนที่ไม่มี order) เรียงตาม name — ต่างจากข้อ 2 ตรงที่คนมี order PENDING ต้องอยู่ในผลด้วย',
 ref:"SELECT c.name\nFROM customers c\nWHERE NOT EXISTS (\n  SELECT 1 FROM orders o WHERE o.customer_id = c.id AND o.status = 'PAID')\nORDER BY c.name;"},
{t:'Pivot ยอดขายรายหมวดแยกเดือน (CASE WHEN)',lv:'I',d:"จาก order ที่ PAID ในเดือน ม.ค.–มี.ค. 2026 แสดง category, jan, feb, mar (ยอดขายของแต่ละเดือน ถ้าไม่มีให้เป็น 0) เรียงตาม category — ใช้ substr(order_date,1,7) แยกเดือน",
 ref:"SELECT p.category,\n  SUM(CASE WHEN substr(o.order_date,1,7) = '2026-01' THEN i.qty * i.unit_price ELSE 0 END) AS jan,\n  SUM(CASE WHEN substr(o.order_date,1,7) = '2026-02' THEN i.qty * i.unit_price ELSE 0 END) AS feb,\n  SUM(CASE WHEN substr(o.order_date,1,7) = '2026-03' THEN i.qty * i.unit_price ELSE 0 END) AS mar\nFROM order_items i\nJOIN orders o ON o.id = i.order_id AND o.status = 'PAID'\nJOIN products p ON p.id = i.product_id\nWHERE o.order_date >= '2026-01-01' AND o.order_date < '2026-04-01'\nGROUP BY p.category\nORDER BY p.category;"},
{t:'ส่วนแบ่งยอดขายของแต่ละหมวด (% of total)',lv:'I',d:'จาก order ที่ PAID แสดง category, revenue, pct (ร้อยละของยอดรวมทุกหมวด ปัดทศนิยม 1 ตำแหน่งด้วย ROUND) เรียง revenue มากไปน้อย แล้ว category',
 ref:"SELECT p.category, SUM(i.qty * i.unit_price) AS revenue,\n       ROUND(100.0 * SUM(i.qty * i.unit_price) / SUM(SUM(i.qty * i.unit_price)) OVER (), 1) AS pct\nFROM order_items i\nJOIN orders o ON o.id = i.order_id AND o.status = 'PAID'\nJOIN products p ON p.id = i.product_id\nGROUP BY p.category\nORDER BY revenue DESC, p.category;"},
{t:'พนักงานที่ได้มากกว่าค่าเฉลี่ยของแผนกตัวเอง',lv:'I',d:'แสดง dept, name, salary, dept_avg (ค่าเฉลี่ยเงินเดือนของแผนก ปัด 2 ตำแหน่ง) เฉพาะคนที่ salary > ค่าเฉลี่ยของแผนกตัวเอง เรียง dept, salary มากไปน้อย, name',
 ref:"WITH x AS (\n  SELECT dept, name, salary, AVG(salary) OVER (PARTITION BY dept) AS dept_avg FROM employees)\nSELECT dept, name, salary, ROUND(dept_avg, 2) AS dept_avg\nFROM x WHERE salary > dept_avg\nORDER BY dept, salary DESC, name;"},
{t:'ลูกค้าคนแรกของแต่ละเมือง',lv:'I',d:'แสดง city, name, joined_at ของลูกค้าที่สมัครเร็วที่สุดในแต่ละเมือง (ถ้าวันเท่ากันเลือก id น้อยกว่า) เรียงตาม city',
 ref:"WITH r AS (\n  SELECT city, name, joined_at, ROW_NUMBER() OVER (PARTITION BY city ORDER BY joined_at, id) AS rn FROM customers)\nSELECT city, name, joined_at FROM r WHERE rn = 1 ORDER BY city;"},
{t:'ยอดแต่ละ order เทียบกับครั้งก่อนของลูกค้าคนเดิม',lv:'A',d:'สำหรับ order ที่ PAID แสดง name, order_id, total, prev_total (ยอดของ order PAID ครั้งก่อนของลูกค้าคนเดียวกัน ครั้งแรกเป็น NULL), increased (1 ถ้า total > prev_total, 0 ถ้าไม่, NULL ถ้าเป็นครั้งแรก) เรียง name แล้ว order_date',
 ref:"WITH t AS (\n  SELECT c.name, o.id AS order_id, o.order_date, SUM(i.qty * i.unit_price) AS total\n  FROM orders o\n  JOIN customers c ON c.id = o.customer_id\n  JOIN order_items i ON i.order_id = o.id\n  WHERE o.status = 'PAID'\n  GROUP BY c.name, o.id, o.order_date),\nl AS (\n  SELECT *, LAG(total) OVER (PARTITION BY name ORDER BY order_date) AS prev_total FROM t)\nSELECT name, order_id, total, prev_total,\n       CASE WHEN prev_total IS NULL THEN NULL WHEN total > prev_total THEN 1 ELSE 0 END AS increased\nFROM l ORDER BY name, order_date;"},
{t:'ระยะห่างเฉลี่ย (วัน) ระหว่างการซื้อของลูกค้าประจำ',lv:'A',d:'สำหรับลูกค้าที่มี order PAID ตั้งแต่ 2 ครั้งขึ้นไป แสดง name, orders (จำนวน order PAID), avg_gap_days (ค่าเฉลี่ยจำนวนวันระหว่าง order ติดกัน ปัด 1 ตำแหน่ง ใช้ julianday(substr(order_date,1,10))) เรียง avg_gap_days น้อยไปมาก แล้ว name',
 ref:"WITH p AS (\n  SELECT c.name, julianday(substr(o.order_date, 1, 10)) AS d\n  FROM orders o JOIN customers c ON c.id = o.customer_id\n  WHERE o.status = 'PAID'),\ng AS (\n  SELECT name, d - LAG(d) OVER (PARTITION BY name ORDER BY d) AS gap FROM p)\nSELECT name, COUNT(*) AS orders, ROUND(AVG(gap), 1) AS avg_gap_days\nFROM g GROUP BY name HAVING COUNT(*) >= 2\nORDER BY avg_gap_days, name;"},
{t:'หัวหน้าและทีมที่ดูแลโดยตรง (self join)',lv:'I',d:'แสดง manager (ชื่อหัวหน้า), reports (จำนวนลูกน้องโดยตรง), team_salary (ผลรวมเงินเดือนลูกน้องโดยตรง) เฉพาะคนที่มีลูกน้อง เรียง reports มากไปน้อย แล้ว manager',
 ref:"SELECT m.name AS manager, COUNT(*) AS reports, SUM(e.salary) AS team_salary\nFROM employees e\nJOIN employees m ON m.id = e.manager_id\nGROUP BY m.id, m.name\nORDER BY reports DESC, manager;"},
{t:'ลูกค้าที่ใช้จ่ายสูงสุดของแต่ละเมือง (กรณีเสมอเอาทุกคน)',lv:'A',d:'จาก order ที่ PAID คำนวณยอดใช้จ่ายรวมต่อลูกค้า แล้วแสดง city, name, spent ของลูกค้าที่ยอดสูงสุดในเมืองของตัวเอง (ถ้าเท่ากันให้แสดงทุกคน) เรียง city แล้ว name — ใช้ RANK ไม่ใช่ ROW_NUMBER',
 ref:"WITH s AS (\n  SELECT c.city, c.name, SUM(i.qty * i.unit_price) AS spent\n  FROM customers c\n  JOIN orders o ON o.customer_id = c.id AND o.status = 'PAID'\n  JOIN order_items i ON i.order_id = o.id\n  GROUP BY c.id, c.city, c.name),\nr AS (SELECT *, RANK() OVER (PARTITION BY city ORDER BY spent DESC) AS rk FROM s)\nSELECT city, name, spent FROM r WHERE rk = 1 ORDER BY city, name;"},
{t:'คู่สินค้าที่ถูกซื้อใน order เดียวกันบ่อยที่สุด',lv:'A',d:'จาก order ที่ PAID หา "คู่สินค้า" ที่อยู่ใน order เดียวกัน แสดง product_a, product_b (ชื่อสินค้า โดย product_a คือสินค้าที่ id น้อยกว่า), times (จำนวน order ที่มีทั้งคู่) เรียง times มากไปน้อย แล้ว product_a, product_b',
 ref:"SELECT pa.name AS product_a, pb.name AS product_b, COUNT(*) AS times\nFROM order_items a\nJOIN order_items b ON b.order_id = a.order_id AND b.product_id > a.product_id\nJOIN orders o ON o.id = a.order_id AND o.status = 'PAID'\nJOIN products pa ON pa.id = a.product_id\nJOIN products pb ON pb.id = b.product_id\nGROUP BY pa.name, pb.name\nORDER BY times DESC, product_a, product_b;"}
);

 tests:[

  {n:'+66',args:['+66 81 234 5678'],expected:'081-234-5678'},{n:'+66 ติดกัน',args:['+66912345678'],expected:'091-234-5678'},{n:'ขึ้นต้น 06',args:['0612345678'],expected:'061-234-5678'},

  {n:'11 หลัก',args:['08123456789'],expected:''},{n:'ขึ้นต้น 07',args:['0712345678'],expected:''},{n:'+66 ตามด้วย 0',args:['+660812345678'],expected:''},
  {n:'มีวงเล็บ',args:['(081) 234 5678'],expected:''},{n:'มีตัวอักษร',args:['081-234-567A'],expected:''},{n:'ข้อความว่าง',args:[''],expected:''},{n:'+ อยู่กลาง',args:['081+2345678'],expected:''}],
 sol:"function formatThaiMobile(text) {\n  let t = String(text).trim();\n  if (t.startsWith('+66')) { t = t.slice(3).trim(); if (t.startsWith('0')) return ''; t = '0' + t; }\n  if (!/^[0-9 -]+$/.test(t)) return '';\n  const d = t.replace(/[ -]/g, '');\n  if (!/^0[689]\\d{8}$/.test(d)) return '';\n  return d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6);\n}",
 sample:'เขียนฟังก์ชัน formatThaiMobile(text) รับข้อความ คืนเบอร์มือถือไทยในรูปแบบ 0XX-XXX-XXXX (สามหลัก ขีด สามหลัก ขีด สี่หลัก) ถ้าไม่ถูกต้องให้คืนข้อความว่าง\nขั้นตอน:\n1. ตัดช่องว่างหน้าและหลังข้อความ\n2. ถ้าขึ้นต้นด้วยเครื่องหมายบวกตามด้วย 66 ให้ตัดส่วนนั้นออกและตัดช่องว่างที่ตามมา ถ้าตัวแรกที่เหลือเป็นเลขศูนย์ให้คืนข้อความว่าง ไม่งั้นเติมเลขศูนย์ไว้ข้างหน้า\n3. ข้อความที่เหลือต้องประกอบด้วยตัวเลข ช่องว่าง และขีดเท่านั้น ถ้ามีอักขระอื่น เช่น วงเล็บ ตัวอักษร หรือเครื่องหมายบวกที่ไม่ได้อยู่ต้นข้อความ ให้คืนข้อความว่าง\n4. ลบช่องว่างและขีดออก ต้องเหลือตัวเลขพอดี 10 หลัก และสองหลักแรกต้องเป็น 06, 08 หรือ 09 ไม่งั้นคืนข้อความว่าง\n5. คืนผลเป็นสามหลักแรก ขีด สามหลักถัดไป ขีด สี่หลักสุดท้าย\nตัวอย่าง: "0812345678" → "081-234-5678", "+66 81 234 5678" → "081-234-5678", "+66912345678" → "091-234-5678"\nต้องคืนข้อความว่าง: "021234567", "0712345678", "+660812345678", "(081) 234 5678", "081+2345678", ""'},
{id:'pt4',title:'ปิดบังอีเมล (PDPA)',fn:'maskEmail',params:'email',
 spec:'ฟังก์ชัน maskEmail(email) คืนอีเมลที่ปิดบังส่วนชื่อ หรือ "" ถ้ารูปแบบผิด\n1) ตัดช่องว่างหน้า/หลัง ต้องมี @ หนึ่งตัวพอดี ส่วนหน้า (local) และส่วนหลัง (domain) ต้องไม่ว่าง ห้ามมีช่องว่างภายใน และ domain ต้องมีจุดอย่างน้อยหนึ่งจุดที่ไม่อยู่หัวหรือท้าย\n2) local ยาว ≥ 3: คงตัวแรกและตัวสุดท้าย ตัวกลางแทนด้วย * จำนวนเท่าเดิม · ยาว 2: คงตัวแรก ตัวที่สองเป็น * · ยาว 1: เป็น *\n3) domain แปลงเป็นตัวพิมพ์เล็ก ส่วน local คงตัวพิมพ์เดิม',
 tests:[
  {n:'ปกติ',args:['somchai@example.com'],expected:'s*****i@example.com'},{n:'domain ตัวใหญ่',args:['Anan@Mail.CO.TH'],expected:'A**n@mail.co.th'},{n:'local 3 ตัว',args:['bob@x.io'],expected:'b*b@x.io'},
  {n:'local 2 ตัว',args:['ab@x.io'],expected:'a*@x.io'},{n:'local 1 ตัว',args:['a@x.io'],expected:'*@x.io'},{n:'ช่องว่างหน้าหลัง',args:['  dao.p@corp.com '],expected:'d***p@corp.com'},
  {n:'ไม่มี @',args:['somchai.example.com'],expected:''},{n:'@ สองตัว',args:['a@b@c.com'],expected:''},{n:'local ว่าง',args:['@x.io'],expected:''},
  {n:'domain ไม่มีจุด',args:['user@localhost'],expected:''},{n:'domain จุดท้าย',args:['user@mail.'],expected:''},{n:'มีช่องว่างกลาง',args:['so mchai@x.io'],expected:''},{n:'ข้อความว่าง',args:[''],expected:''}],
 sol:"function maskEmail(email) {\n  const t = String(email).trim();\n  const parts = t.split('@');\n  if (parts.length !== 2) return '';\n  const [local, domain] = parts;\n  if (!local || !domain || /\\s/.test(t)) return '';\n  const dot = domain.indexOf('.');\n  if (dot <= 0 || domain.endsWith('.')) return '';\n  const n = local.length;\n  const masked = n === 1 ? '*' : n === 2 ? local[0] + '*' : local[0] + '*'.repeat(n - 2) + local[n - 1];\n  return masked + '@' + domain.toLowerCase();\n}",
 sample:'เขียนฟังก์ชัน maskEmail(email) ปิดบังชื่อในอีเมลตามนี้ ถ้ารูปแบบผิดให้คืนข้อความว่าง\n1. ตัดช่องว่างหน้าและหลังก่อน ถ้ายังมีช่องว่างอยู่ภายในให้คืนข้อความว่าง\n2. ต้องมีเครื่องหมาย @ หนึ่งตัวพอดี แบ่งเป็นส่วนชื่อ (ก่อน @) และโดเมน (หลัง @) ทั้งสองส่วนต้องไม่ว่าง\n3. โดเมนต้องมีจุดอย่างน้อยหนึ่งจุด และจุดนั้นต้องไม่ใช่ตัวแรกหรือตัวสุดท้ายของโดเมน\n4. ปิดบังส่วนชื่อ: ถ้ายาว 3 ตัวขึ้นไป ให้คงตัวแรกและตัวสุดท้าย ตัวตรงกลางทุกตัวเปลี่ยนเป็นดอกจันจำนวนเท่าเดิม ถ้ายาว 2 ตัว คงตัวแรกแล้วตัวที่สองเป็นดอกจัน ถ้ายาว 1 ตัว ให้เป็นดอกจันตัวเดียว ส่วนชื่อคงตัวพิมพ์เล็กใหญ่เดิม\n5. โดเมนแปลงเป็นตัวพิมพ์เล็กทั้งหมด\nตัวอย่าง: "somchai@example.com" → "s*****i@example.com", "Anan@Mail.CO.TH" → "A**n@mail.co.th", "ab@x.io" → "a*@x.io", "a@x.io" → "*@x.io"\nต้องคืนข้อความว่าง: "a@b@c.com", "@x.io", "user@localhost", "user@mail.", "so mchai@x.io"'},
{id:'pt5',title:'แปลงข้อความจำนวนเงินเป็นตัวเลข',fn:'parseAmount',params:'text',
 spec:'ฟังก์ชัน parseAmount(text) คืนจำนวนเงินเป็น number หรือ null ถ้ารูปแบบผิด\n1) ตัดช่องว่างหน้า/หลัง อาจมีสัญลักษณ์ "฿" นำหน้า หรือคำว่า "บาท" ต่อท้าย (มีช่องว่างคั่นได้) แต่ห้ามมีทั้งสองอย่างพร้อมกัน\n2) ตัวเลขเป็นจำนวนบวกหรือศูนย์ มีทศนิยมได้ไม่เกิน 2 ตำแหน่ง\n3) ใช้ comma คั่นหลักพันได้ แต่ต้องถูกตำแหน่งทุกกลุ่ม (กลุ่มแรก 1–3 หลัก กลุ่มถัดไป 3 หลักพอดี) หรือไม่ใช้ comma เลยก็ได้\n4) ห้ามเครื่องหมายลบ ห้ามเลขนำหน้าด้วย 0 เกินจำเป็น (เช่น 0012) แต่ 0.50 ได้',
 tests:[
  {n:'มี comma และทศนิยม',args:['1,234.50'],expected:1234.5},{n:'ไม่มี comma',args:['1234'],expected:1234},{n:'฿ นำหน้า',args:['฿1,000'],expected:1000},
  {n:'บาท ต่อท้าย',args:['250 บาท'],expected:250},{n:'บาท ติดกัน',args:['99.99บาท'],expected:99.99},{n:'ล้าน',args:['1,000,000'],expected:1000000},
  {n:'ศูนย์จุด',args:['0.50'],expected:0.5},{n:'ช่องว่างหน้าหลัง',args:['  ฿ 75 '],expected:75},{n:'ทั้ง ฿ และ บาท',args:['฿100 บาท'],expected:null},
  {n:'comma ผิดตำแหน่ง',args:['12,34'],expected:null},{n:'ทศนิยม 3 ตำแหน่ง',args:['1.234'],expected:null},{n:'ติดลบ',args:['-50'],expected:null},
  {n:'เลข 0 นำหน้า',args:['0012'],expected:null},{n:'ข้อความว่าง',args:[''],expected:null},{n:'มีตัวอักษร',args:['12a'],expected:null},{n:'กลุ่มแรก 4 หลัก',args:['1234,567'],expected:null}],
 sol:"function parseAmount(text) {\n  let t = String(text).trim();\n  const hasSym = t.startsWith('฿'), hasWord = t.endsWith('บาท');\n  if (hasSym && hasWord) return null;\n  if (hasSym) t = t.slice(1).trim();\n  if (hasWord) t = t.slice(0, -3).trim();\n  const re = /^(?:0|[1-9]\\d{0,2}(?:,\\d{3})+|[1-9]\\d*)(?:\\.\\d{1,2})?$/;\n  if (!re.test(t)) return null;\n  return Number(t.replace(/,/g, ''));\n}",
 sample:'เขียนฟังก์ชัน parseAmount(text) แปลงข้อความจำนวนเงินเป็นตัวเลข (number) ถ้ารูปแบบผิดให้คืน null\n1. ตัดช่องว่างหน้าและหลัง\n2. อาจมีสัญลักษณ์บาท (฿) อยู่หน้าสุด หรือคำว่า บาท อยู่ท้ายสุดอย่างใดอย่างหนึ่ง ถ้ามีทั้งสองอย่างให้คืน null ตัดสัญลักษณ์หรือคำนั้นออกพร้อมช่องว่างที่ติดกัน\n3. ส่วนที่เหลือต้องเป็นตัวเลขบวกหรือศูนย์เท่านั้น ห้ามเครื่องหมายลบหรือตัวอักษรอื่น\n4. ใช้จุลภาคคั่นหลักพันได้ ถ้าใช้ต้องถูกทุกกลุ่ม: กลุ่มแรก 1 ถึง 3 หลัก กลุ่มที่ตามมากลุ่มละ 3 หลักพอดี หรือจะไม่ใช้จุลภาคเลยก็ได้\n5. ทศนิยมมีได้ไม่เกิน 2 ตำแหน่ง\n6. ห้ามมีเลขศูนย์นำหน้าเกินจำเป็น เช่น 0012 ผิด แต่ 0 หรือ 0.50 ถูก\n7. คืนค่าเป็นตัวเลขหลังลบจุลภาคออก\nตัวอย่าง: "1,234.50" → 1234.5, "฿1,000" → 1000, "250 บาท" → 250, "99.99บาท" → 99.99, "0.50" → 0.5\nต้องคืน null: "฿100 บาท", "12,34", "1234,567", "1.234", "-50", "0012", "12a", ""'}
);

 {code:`function minTents(r, s) {
  const dp = new Array(r + 1).fill(-1);   // -1 = จัดไม่ได้
  dp[0] = 0;                              // 0 คน ใช้ 0 หลัง
  for (let i = 1; i <= r; i++) {
    for (const sz of s) {
      if (i >= sz && dp[i - sz] >= 0) {   // ถ้าจัด i-sz คนได้ ก็เพิ่มเต็นท์ขนาด sz อีกหลัง
        dp[i] = dp[i] < 0 ? dp[i - sz] + 1 : Math.min(dp[i], dp[i - sz] + 1);
      }
    }
  }
  return dp[r];
}
// r=12, s=[5,4] → 3 (4+4+4) · greedy เลือก 5 ก่อนจะจัดไม่ได้ — นี่คือเหตุผลที่ต้องใช้ DP`},

/* ---------- modal ยืนยัน/แจ้งเตือน ตาม theme (แทน confirm/alert ของระบบที่เป็นกล่องสีขาว) ---------- */
function uiDialog(msg, opts){
  opts = opts || {};
  return new Promise(resolve => {
    const d = document.createElement('dialog'); d.className = 'ui-dialog';
    const box = document.createElement('div'); box.className = 'in';
    if (opts.title) { const h = document.createElement('h3'); h.textContent = opts.title; box.appendChild(h); }
    if (msg) { const p = document.createElement('p'); p.textContent = msg; box.appendChild(p); }
    const row = document.createElement('div'); row.className = 'ui-dialog-actions';
    const done = v => { d.close(); d.remove(); resolve(v); };
    if (opts.cancel !== false) { const c = document.createElement('button'); c.className = 'ui-btn'; c.textContent = opts.cancel || 'ยกเลิก'; c.onclick = () => done(false); row.appendChild(c); }
    const ok = document.createElement('button'); ok.className = 'ui-btn ' + (opts.danger ? 'danger' : 'primary'); ok.textContent = opts.ok || 'ตกลง';
    ok.onclick = () => done(true); row.appendChild(ok);
    box.appendChild(row); d.appendChild(box);
    d.addEventListener('cancel', e => { e.preventDefault(); done(false); });   // ปุ่ม back / Esc
    d.addEventListener('click', e => { if (e.target === d) done(false); });     // แตะนอกกล่อง
    document.body.appendChild(d); d.showModal(); ok.focus({preventScroll: true});
  });
}
const uiConfirm = (msg, opts) => uiDialog(msg, opts);
const uiAlert = (msg, opts) => uiDialog(msg, Object.assign({cancel: false}, opts));

// กระจายหน่วยลงวันตามสัดส่วนชั่วโมง — วันน้อยจะรวมหลายหน่วย วันมากหน่วยใหญ่จะต่อหลายวัน
function buildPlan(){
  const dates = studyDates(), units = UNITS.filter(u => !ST.sched.units || ST.sched.units.includes(u.id));
  if (!dates.length || !units.length) return [];
  const W = units.reduce((s, u) => s + u.h, 0), per = W / dates.length;
  let acc = 0;
  const spans = units.map(u => { const s = acc; acc += u.h; return {u, s, e: acc}; });
  return dates.map((date, i) => {
    const a = i * per, b = (i + 1) * per;
    const items = spans.filter(x => Math.min(b, x.e) - Math.max(a, x.s) > 1e-6).map(x => ({u: x.u, cont: x.s < a - 1e-6}));
    return {date, items};
  });
}

/* ================= ตัวรันโค้ด JS (Web Worker) + หน้าฝึก Coding / SQL Lab / Prompt Lab ================= */
/* ---------- JS runner ---------- */
const WORKER_SRC = `onmessage = e => {
  const { code, fn, tests } = e.data;
  let f;
  try { f = new Function(code + '\\n;return typeof ' + fn + ' === "function" ? ' + fn + ' : undefined;')(); }
  catch (err) { postMessage({ error: 'Syntax/Runtime error: ' + err.message }); return; }
  if (typeof f !== 'function') { postMessage({ error: 'ไม่พบฟังก์ชัน ' + fn }); return; }
  postMessage({ results: tests.map(t => {
    const t0 = Date.now();
    try { const out = f(...JSON.parse(JSON.stringify(t.args))); const s = JSON.stringify(out), ms = Date.now() - t0, slow = t.maxMs && ms > t.maxMs;
      return { ok: s === JSON.stringify(t.expected) && !slow, out: (s === undefined ? 'undefined' : s) + (slow ? ' (ช้าเกิน ' + t.maxMs + ' ms)' : ''), ms }; }
    catch (err) { return { ok: false, out: 'Error: ' + err.message, ms: Date.now() - t0 }; }
  }) });
};`;
let workerUrl = null;
const genCache = {};
function expandTests(p, tests){
  return tests.map(t => {
    if (!t.gen) return t;
    if (!genCache[t.gen]) { const args = GEN[t.gen](); const ref = new Function(p.sol + '\n;return ' + p.fn + ';')(); genCache[t.gen] = { args, expected: ref(...JSON.parse(JSON.stringify(args))) }; }
    return { n: t.n, args: genCache[t.gen].args, expected: genCache[t.gen].expected, big: true, maxMs: t.maxMs };
  });
}
function runJs(code, fn, tests){
  const limit = 3000 + tests.filter(t => t.big).length * 4000;
  return new Promise(resolve => {
    let w;
    try { workerUrl = workerUrl || URL.createObjectURL(new Blob([WORKER_SRC], { type: 'text/javascript' })); w = new Worker(workerUrl); }
    catch (e) { resolve(runInline(code, fn, tests)); return; }
    const timer = setTimeout(() => { w.terminate(); resolve({ error: `Timeout > ${limit / 1000} วินาที (infinite loop หรืออัลกอริทึมช้าเกินไป)` }); }, limit);
    w.onmessage = e => { clearTimeout(timer); w.terminate(); resolve(e.data); };
    w.onerror = e => { clearTimeout(timer); w.terminate(); resolve({ error: e.message || 'Worker error' }); };
    w.postMessage({ code, fn, tests });
  });
}
function runInline(code, fn, tests){
  let f;
  try { f = new Function(code + '\n;return typeof ' + fn + ' === "function" ? ' + fn + ' : undefined;')(); } catch (err) { return { error: err.message }; }
  if (typeof f !== 'function') return { error: 'ไม่พบฟังก์ชัน ' + fn };
  return { results: tests.map(t => { try { const s = JSON.stringify(f(...JSON.parse(JSON.stringify(t.args)))); return { ok: s === JSON.stringify(t.expected), out: String(s) }; } catch (err) { return { ok: false, out: 'Error: ' + err.message }; } }) };
}
function showResult(out, r, tests){
  out.innerHTML = '';
  if (r.error) { out.appendChild(el('div', 'fail', '✗ ' + r.error)); return false; }
  const pass = r.results.filter(x => x.ok).length, all = pass === tests.length;
  out.appendChild(el('div', all ? 'pass' : 'fail', `ผ่าน ${pass}/${tests.length} test${all ? ' 🎉' : ''}`));
  r.results.forEach((x, k) => {
    const t = tests[k], a = t.args.map(v => JSON.stringify(v)).join(', ');
    const label = t.big ? t.n : (t.n ? t.n + ': ' : '') + '(' + (a.length > 120 ? a.slice(0, 120) + '…' : a) + ')';
    out.appendChild(el('div', x.ok ? 'pass' : 'fail', `${x.ok ? '✓' : '✗'} ${label} → ${x.out.length > 120 ? x.out.slice(0, 120) + '…' : x.out}${x.ok ? '' : '   expected ' + JSON.stringify(t.expected)}${t.big && x.ms != null ? `  (${x.ms} ms)` : ''}`));
  });
  return all;
}
function codeArea(key, starter, rows){
  const ta = el('textarea'); ta.rows = rows || 12; ta.spellcheck = false; ta.value = ST.code[key] != null ? ST.code[key] : starter;
  ta.oninput = () => { ST.code[key] = ta.value; save(); };
  ta.onkeydown = e => { if (e.key === 'Tab') { e.preventDefault(); const s = ta.selectionStart; ta.value = ta.value.slice(0, s) + '  ' + ta.value.slice(ta.selectionEnd); ta.selectionStart = ta.selectionEnd = s + 2; ST.code[key] = ta.value; save(); } };
  return ta;
}
function reveal(label, text){ const d = el('details'); d.appendChild(el('summary', 'muted', label)); d.appendChild(el('pre', null, text)); d.style.margin = '6px 0'; return d; }

/* ---------- SQL lab ---------- */
let SQL = null, sqlLoading = null;
function loadSql(){
  if (sqlLoading) return sqlLoading;
  sqlLoading = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    const CDN = 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/';
    // ในแอปมีไฟล์ sqljs/ อยู่ในเครื่อง (ใช้ออฟไลน์ได้) ถ้าโหลดไม่ได้ค่อยใช้ CDN
    const tryLoad = (base, next) => {
      const s = document.createElement('script'); s.src = base + 'sql-wasm.js';
      s.onload = () => initSqlJs({ locateFile: f => base + f }).then(x => { SQL = x; resolve(x); }).catch(e => next ? next() : reject(e));
      s.onerror = () => { s.remove(); next ? next() : reject(new Error('โหลด SQLite engine ไม่ได้ (ต้องต่ออินเทอร์เน็ต)')); };
      document.head.appendChild(s);
    };
    location.protocol.startsWith('http') ? tryLoad('sqljs/', () => tryLoad(CDN)) : tryLoad(CDN);
  });
  sqlLoading.catch(() => { sqlLoading = null; });
  return sqlLoading;
}
function execQ(q){ const db = new SQL.Database(); try { db.run(SHOP_DB); const r = db.exec(q); return r.length ? r[r.length - 1] : { columns: [], values: [] }; } finally { db.close(); } }

  tw.appendChild(t); return tw;
}

/* ---------- Prompt lab ---------- */
const CODE_IN_PROMPT = /```|=>|\bfunction\b|\breturn\b|\bconst\s|\blet\s|\bvar\s|\bfor\s*\(|\bwhile\s*\(|\.replace\(|\.match\(|new RegExp|\\d|\\s|\[0-9\]/i;
function promptIssue(t){
  t = (t || '').trim();
  if (t.length < 30) return 'prompt สั้นเกินไป (อย่างน้อย 30 ตัวอักษร)';
  if (t.length > 2000) return 'prompt ยาวเกิน 2000 ตัวอักษร';
  if (CODE_IN_PROMPT.test(t)) return 'ห้ามเขียนโค้ดหรือ regex ใน prompt (พบ function, return, =>, \\d ฯลฯ)';
  return '';
}
function wrapPrompt(task, text){
  return `คุณคือผู้ช่วยเขียนโค้ด จงเขียนฟังก์ชัน JavaScript (ES2020) ชื่อ ${task.fn}(${task.params}) ตามคำสั่งของผู้ใช้ด้านล่าง\nข้อกำหนดของระบบ:\n- ตอบเป็นโค้ด JavaScript ใน code block เดียว ไม่ต้องอธิบาย\n- ประกาศ function ${task.fn}(${task.params}) { ... } ที่ระดับบนสุด\n- ห้ามใช้ require, import, fetch หรือ API ของ browser/Node.js\n\nคำสั่งของผู้ใช้:\n"""\n${text.trim()}\n"""`;
}
function extractCode(t){ const mm = t.match(/```(?:javascript|js)?[^\n]*\n([\s\S]*?)```/i); return (mm ? mm[1] : t).trim(); }

function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
// สลับลำดับข้อและตัวเลือก (คืนสำเนา ไม่แก้ข้อมูลต้นฉบับ)
function shuffledQs(qs){ return shuffle(qs).map(q => { const idx = shuffle(q.o.map((_, i) => i)); return Object.assign({}, q, {o: idx.map(i => q.o[i]), a: idx.indexOf(q.a)}); }); }
const postQs = l => (POST[l.id] || []).concat(l.quiz);

function stepHead(n, t, info){ const h = el('div', 'step'); h.appendChild(el('span', 'num', String(n))); h.appendChild(el('span', 'st', t)); if (info) h.appendChild(el('span', 'tag', info)); return h; }
// แบบทดสอบปรนัย: opts.dontKnow เพิ่มตัวเลือก "ยังไม่รู้" · ต้องตอบครบก่อนส่ง
function renderTest(qs, opts){
  const box = el('div'), picks = {};
  const ui = qs.map((q, i) => {
    const w = el('div', 'q'); w.appendChild(el('div', 'qt', `${i + 1}. ${q.q}`));
    const choices = q.o.slice(); if (opts.dontKnow) choices.push('ยังไม่รู้');
    const btns = choices.map((o, k) => {
      const idk = opts.dontKnow && k === q.o.length;
      const b = el('button', 'opt' + (idk ? ' idk' : ''), (idk ? '' : String.fromCharCode(65 + k) + '. ') + o);
      b.onclick = () => { if (box.dataset.checked) return; picks[i] = k; btns.forEach((x, j) => x.classList.toggle('sel', j === k)); };
      w.appendChild(b); return b;
    });
    const ex = el('div', 'explain hidden'); w.appendChild(ex);
    box.appendChild(w); return {btns, ex};
  });
  const row = el('div', 'row'), res = el('span', 'muted');
  const chk = el('button', 'btn primary', opts.label || 'ตรวจคำตอบ');
  chk.onclick = () => {
    if (box.dataset.checked) return;
    const missing = qs.findIndex((_, i) => picks[i] == null);
    if (missing >= 0) { res.className = 'warn'; res.textContent = `ยังไม่ได้ตอบข้อ ${missing + 1}`; ui[missing].btns[0].scrollIntoView({block: 'center'}); return; }
    box.dataset.checked = '1'; chk.disabled = true; let ok = 0;
    qs.forEach((q, i) => {
      const right = picks[i] === q.a; if (right) ok++;
      ui[i].btns.forEach((b, k) => { b.classList.remove('sel'); if (k === q.a) b.classList.add('correct'); else if (picks[i] === k) b.classList.add('wrong'); });
      ui[i].ex.textContent = (right ? '✓ ถูก' : '✗ คำตอบคือ ' + String.fromCharCode(65 + q.a)) + (q.e ? ' — ' + q.e : '');
      ui[i].ex.classList.remove('hidden');
    });
    res.className = 'muted'; res.textContent = `ได้ ${ok}/${qs.length}`;
    opts.onDone && opts.onDone(ok, qs.length, res, qs.map((q, i) => picks[i] === q.a));
  };
  row.appendChild(chk); row.appendChild(res); box.appendChild(row);
  return box;
}

  if (!['mcq', 'code', 'sql', 'prompt'].includes(kind)) kind = 'mcq';
  ST.practice = kind; save();
  m.appendChild(el('h1', null, 'ฝึกโจทย์'));
  const seg = el('div', 'seg');
  [['mcq', 'ปรนัย', `${allDrillQs(LESSONS.map(l => l.id)).length} ข้อ`], ['code', 'Coding', `${PROBLEMS.filter(p => ST.prob[p.id]).length}/${PROBLEMS.length}`],
   ['sql', 'SQL', `${SQL_EX.filter((_, i) => ST.sql[i]).length}/${SQL_EX.length}`], ['prompt', 'Prompt', `${PROMPT_TASKS.filter(t => ST.prompt[t.id]).length}/${PROMPT_TASKS.length}`]]
    .forEach(([k, label, cnt]) => { const b = el('button', k === kind ? 'on' : '', label); b.appendChild(el('small', null, cnt)); b.onclick = () => nav('/practice/' + k); seg.appendChild(b); });
  m.appendChild(seg);
  if (kind === 'mcq') return viewDrill(m);
  const lesson = {code: 'algo', sql: 'sqlt', prompt: 'pc'}[kind], l = lessonById(lesson);
  if (l && !lessonPassed(lesson)) {
    const a = el('a', 'item card'); a.href = '#/lesson/' + lesson; a.style.padding = '12px 16px';
    a.appendChild(el('span', lessonDot(lesson)));
    const mm = el('div', 'main'); mm.appendChild(el('div', 'ttl', 'แนะนำ: เรียนบท ' + shortTitle(l) + ' ก่อน')); mm.appendChild(el('div', 'sub', subTitle(l)));
    a.appendChild(mm); a.appendChild(el('span', 'chev', '›')); m.appendChild(a);
  }
  if (kind === 'code') renderProblems(m);
  else if (kind === 'sql') renderSqlLab(m);
  else renderPromptLab(m);
}

/* ---------- ฝึกปรนัย: สุ่มจากคลังทั้งหมด (pre-test + post-test + BANK) ตามบทที่เลือก ---------- */
let drillRun = null;  // ชุดที่กำลังทำ (ไม่บันทึก — รีเฟรชแล้วเริ่มใหม่)
const qKey = q => q.lid + '|' + q.q.slice(0, 48);
function allDrillQs(ids){
  return ids.flatMap(id => { const l = lessonById(id); return [].concat(l ? l.quiz : [], POST[id] || [], BANK[id] || []).map(q => Object.assign({lid: id}, q)); });
}
function drillStats(id){ const d = (ST.drill || {})[id]; return d && d.n ? {n: d.n, pct: Math.round(d.ok / d.n * 100)} : null; }
function viewDrill(m){
  ST.drill = ST.drill || {}; ST.wrongQs = ST.wrongQs || {}; ST.drillCfg = ST.drillCfg || {ids: LESSONS.map(l => l.id), n: 20, mode: 'all'};
  const cfg = ST.drillCfg;
  if (drillRun) {
    const c = el('div', 'card');
    c.appendChild(el('h2', null, `ชุดฝึก ${drillRun.length} ข้อ`));
    c.appendChild(el('p', 'muted', 'ตอบครบแล้วกดส่ง จะเห็นเฉลยพร้อมคำอธิบายทุกข้อ'));
    c.appendChild(renderTest(drillRun, {label: 'ส่งคำตอบ', onDone: (ok, n, res, results) => {
      drillRun.forEach((q, i) => {
        const d = ST.drill[q.lid] = ST.drill[q.lid] || {n: 0, ok: 0}; d.n++; if (results[i]) d.ok++;
        const k = qKey(q); if (results[i]) delete ST.wrongQs[k]; else ST.wrongQs[k] = 1;
      });
      save();
      const pct = Math.round(ok / n * 100);
      res.className = pct >= 80 ? 'pass' : pct >= 50 ? 'warn' : 'fail';
      res.textContent = `ได้ ${ok}/${n} (${pct}%)`;
      const again = el('button', 'btn primary', 'ทำชุดใหม่'); again.onclick = () => { drillRun = null; render(); window.scrollTo(0, 0); };
      res.parentNode.appendChild(again);
    }}));
    const quit = el('button', 'btn small', 'เลิกทำชุดนี้'); quit.onclick = () => { drillRun = null; render(); };
    m.appendChild(c); m.appendChild(quit);
    return;
  }
  const c = el('div', 'card');
  c.appendChild(el('h2', null, 'ตั้งค่าชุดฝึก'));
  c.appendChild(el('div', 'muted', 'บทที่ต้องการ'));
  const chips = el('div', 'row'), picked = new Set(cfg.ids);
  const allBtn = el('button', 'chipbtn' + (picked.size === LESSONS.length ? ' on' : ''), picked.size === LESSONS.length ? 'ล้างที่เลือก' : 'เลือกทุกบท');
  allBtn.onclick = () => { if (picked.size === LESSONS.length) picked.clear(); else LESSONS.forEach(l => picked.add(l.id)); cfg.ids = [...picked]; save(); render(); };
  chips.appendChild(allBtn);
  GROUPS.forEach(([, ids]) => ids.forEach(id => {
    const l = lessonById(id); if (!l) return;
    const b = el('button', 'chipbtn' + (picked.has(id) ? ' on' : ''), CHIP[id] || shortTitle(l));
    b.onclick = () => { picked.has(id) ? picked.delete(id) : picked.add(id); cfg.ids = [...picked]; save(); render(); };
    chips.appendChild(b);
  }));
  c.appendChild(chips);
  const segOf = (label, opts, cur, fn) => {
    c.appendChild(el('div', 'muted', label));
    const sg = el('div', 'seg');
    opts.forEach(([v, t]) => { const b = el('button', v === cur ? 'on' : '', t); b.onclick = () => { fn(v); save(); render(); }; sg.appendChild(b); });
    c.appendChild(sg);
  };
  const pool = allDrillQs(cfg.ids), wrongPool = pool.filter(q => ST.wrongQs[qKey(q)]);
  segOf('จำนวนข้อ', [[10, '10 ข้อ'], [20, '20 ข้อ'], [30, '30 ข้อ']], cfg.n, v => cfg.n = v);
  segOf('เลือกข้อจาก', [['all', `สุ่มทั้งหมด (${pool.length})`], ['wrong', `เคยตอบผิด (${wrongPool.length})`]], cfg.mode, v => cfg.mode = v);
  const src = cfg.mode === 'wrong' ? wrongPool : pool;
  const start = el('button', 'btn primary block', src.length ? `เริ่มฝึก ${Math.min(cfg.n, src.length)} ข้อ` : 'ยังไม่มีข้อให้ฝึก');
  start.disabled = !src.length;
  start.onclick = () => { drillRun = shuffledQs(shuffle(src).slice(0, cfg.n)); render(); window.scrollTo(0, 0); };
  c.appendChild(start);
  m.appendChild(c);
  // สถิติรายบท — เรียงจากแม่นน้อยสุด เพื่อชี้จุดอ่อน
  const rows = LESSONS.map(l => ({l, s: drillStats(l.id)})).filter(x => x.s).sort((a, b) => a.s.pct - b.s.pct);
  m.appendChild(el('div', 'section-label', 'ความแม่นรายบท (จากการฝึก)'));
  const st = el('div', 'card');
  if (!rows.length) st.appendChild(el('div', 'empty', 'ยังไม่มีสถิติ — ลองฝึกสักชุด'));
  rows.forEach(({l, s}) => {
    const r = el('a', 'item'); r.href = '#/lesson/' + l.id;
    const mm = el('div', 'main'); mm.appendChild(el('div', 'ttl', shortTitle(l)));
    mm.appendChild(el('div', 'sub', `ตอบไป ${s.n} ข้อ · ถูก ${s.pct}%` + (s.pct < 70 ? ' · ควรทบทวน' : '')));
    const bar = el('div', 'progress'), f = el('div'); f.style.width = s.pct + '%'; if (s.pct < 70) f.style.background = 'var(--yellow)'; bar.appendChild(f); mm.appendChild(bar);
    r.appendChild(mm); r.appendChild(el('span', 'chev', '›')); st.appendChild(r);
  });
  m.appendChild(st);
}

/* ================= จำลอง HackerRank: 8 section จับเวลาแยก (สอบครบ หรือซ้อมทีละ section) ================= */
const HR_SECTIONS = [
  {id:'s1', name:'Software Design and Architecture', n:14, min:25, lids:['sysd', 'db', 'micro']},
  {id:'s2', name:'Software Engineering and Development', n:26, min:35, lids:['oop', 'test', 'git', 'fe', 'api', 'sqlt', 'algo', 'hr']},
  {id:'s3', name:'Infrastructure & DevOps', n:8, min:15, lids:['cont', 'cicd', 'cloud', 'mon']},
  {id:'s4', name:'Security', n:4, min:10, lids:['sec']},
  {id:'s5', name:'Future Skill', n:2, min:5, lids:['ai', 'pc']},
  {id:'s6', name:'SQL Coding', n:1, min:10, kind:'sql'},
  {id:'s7', name:'Prompt Coding', n:1, min:15, kind:'prompt'},
  {id:'s8', name:'Software Coding', n:1, min:30, kind:'code'}
];
// โจทย์ coding ที่สุ่มมาใช้ใน section 8 (แนวที่ HackerRank ชอบออก)
const HR_CODE_IDS = ['p22', 'p23', 'p24', 'p25', 'p26', 'p27', 'p28', 'p29', 'p30', 'p1', 'p3', 'p12', 'p13', 'p14', 'p19'];
let hrTimer = null, hrClosing = false;

function hrToast(msg){ const t = el('div', 'toast', msg); document.body.appendChild(t); setTimeout(() => t.remove(), 3500); }
function hrFmt(ms){ const s = Math.max(0, Math.round(ms / 1000)); return `${Math.floor(s / 60)} min ${String(s % 60).padStart(2, '0')} sec`; }
// สลับตัวเลือก รองรับทั้งคำตอบเดียวและหลายคำตอบ
function hrShuffleQ(q){
  const idx = shuffle(q.o.map((_, i) => i));
  return Object.assign({}, q, {o: idx.map(i => q.o[i]), a: Array.isArray(q.a) ? q.a.map(x => idx.indexOf(x)).sort() : idx.indexOf(q.a)});
}
function hrBuild(sec){
  if (sec.kind === 'sql') return {task: HR_SQL[Math.floor(Math.random() * HR_SQL.length)].id};
  if (sec.kind === 'prompt') return {task: HR_PROMPT[Math.floor(Math.random() * HR_PROMPT.length)].id};
  if (sec.kind === 'code') return {task: HR_CODE_IDS[Math.floor(Math.random() * HR_CODE_IDS.length)]};
  const pool = allDrillQs(sec.lids).concat(MULTI.filter(q => sec.lids.includes(q.lid)));
  // ให้มีข้อเลือกหลายคำตอบปนอยู่บ้าง (เหมือนข้อสอบจริง)
  const multi = shuffle(pool.filter(q => q.multi)).slice(0, Math.max(1, Math.round(sec.n / 7)));
  const single = shuffle(pool.filter(q => !q.multi)).slice(0, sec.n - multi.length);
  return {items: shuffle(multi.concat(single)).map(hrShuffleQ)};
}
function hrStart(order){
  const H = ST.hr = {order, pos: 0, secs: {}, startedAt: Date.now(), results: null};
  hrOpenSection(H);
  save(); render(); window.scrollTo(0, 0);
}
function hrOpenSection(H){
  const sec = HR_SECTIONS[H.order[H.pos]];
  H.secs[sec.id] = Object.assign(hrBuild(sec), {ans: {}, marks: {}, cur: 0, code: null, prompt: '\n\n{testcase input}', caseOut: {}, start: Date.now()});
  H.deadline = Date.now() + sec.min * 60000;
}
const hrSec = H => HR_SECTIONS[H.order[H.pos]];

/* ---------- ตรวจคำตอบ ---------- */
function hrMcqOk(q, ans){
  if (ans == null) return false;
  if (Array.isArray(q.a)) return Array.isArray(ans) && ans.length === q.a.length && ans.slice().sort().every((x, i) => x === q.a[i]);
  return ans === q.a;
}
function hrSqlRun(task, q, data){ const db = new SQL.Database(); try { db.run(task.schema + data); const r = db.exec(q); return r.length ? r[r.length - 1] : {columns: [], values: []}; } finally { db.close(); } }
async function hrGrade(sec, S){
  if (!sec.kind) { const ok = S.items.filter((q, i) => hrMcqOk(q, S.ans[i])).length; return {ok, n: S.items.length, pct: Math.round(ok / S.items.length * 100)}; }
  if (sec.kind === 'sql') {
    const t = HR_SQL.find(x => x.id === S.task); let ok = 0;
    try { await loadSql(); for (const d of [t.sample, t.hidden]) { try { if (norm(hrSqlRun(t, S.code || '', d)) === norm(hrSqlRun(t, t.ref, d))) ok++; } catch (e) {} } } catch (e) {}
    return {ok, n: 2, pct: ok * 50, note: ok === 2 ? 'ผ่านทั้งข้อมูลตัวอย่างและชุดซ่อน' : ok === 1 ? 'ผ่านข้อมูลตัวอย่าง แต่ไม่ผ่านชุดซ่อน' : 'ไม่ผ่าน'};
  }
  if (sec.kind === 'prompt') {
    const t = HR_PROMPT.find(x => x.id === S.task);
    const valid = hrPromptIssue(S.prompt) === '';
    const ok = valid ? t.cases.filter((c, i) => (S.caseOut[i] || '').trim() === c.output).length : 0;
    return {ok, n: t.cases.length, pct: Math.round(ok / t.cases.length * 100), note: valid ? `ผลจาก AI ตรง ${ok}/${t.cases.length} เคส` : 'prompt ไม่มี {testcase input}'};
  }
  const p = PROBLEMS.find(x => x.id === S.task), tests = expandTests(p, p.tests);
  const r = await runJs(S.code == null ? p.starter : S.code, p.fn, tests);
  const ok = r.results ? r.results.filter(x => x.ok).length : 0;
  return {ok, n: tests.length, pct: Math.round(ok / tests.length * 100), note: r.error ? r.error : `ผ่าน ${ok}/${tests.length} test`};
}
async function hrClose(auto){
  const H = ST.hr; if (!H || H.results || hrClosing) return;
  hrClosing = true;
  const sec = hrSec(H), S = H.secs[sec.id];
  S.used = Math.min(Date.now(), H.deadline) - S.start;
  S.grade = await hrGrade(sec, S);
  if (auto) hrToast(`หมดเวลา ${sec.name} — ปิด section อัตโนมัติ`);
  H.pos++;
  if (H.pos < H.order.length) hrOpenSection(H);
  else {
    H.results = true; clearInterval(hrTimer);
    const secs = H.order.map(i => { const s = HR_SECTIONS[i]; return {id: s.id, name: s.name, pct: H.secs[s.id].grade.pct}; });
    ST.hrHist = (ST.hrHist || []).concat([{at: Date.now(), mode: H.order.length === HR_SECTIONS.length ? 'full' : 'single', secs}]).slice(-30);
  }
  hrClosing = false;
  save(); render(); window.scrollTo(0, 0);
}
function hrPromptIssue(t){ const n = (t.match(/\{testcase input\}/g) || []).length; if (n !== 1) return 'prompt ต้องมี {testcase input} หนึ่งตำแหน่งพอดี'; if (t.replace('{testcase input}', '').trim().length < 20) return 'prompt สั้นเกินไป'; return ''; }

function hrRunView(m, H){
  const sec = hrSec(H), S = H.secs[sec.id];
  const bar = el('div', 'hr-bar');
  const chip = el('span', 'hr-timer'); bar.appendChild(chip);
  bar.appendChild(el('span', 'hr-secname', `${H.order.length > 1 ? `Section ${H.pos + 1}/${H.order.length} · ` : ''}${sec.name}`));
  const proceed = el('button', 'btn primary small', 'Save & Proceed');
  proceed.onclick = async () => {
    const left = sec.kind ? 0 : S.items.filter((_, i) => S.ans[i] == null).length;
    const msg = (left ? `ยังไม่ได้ตอบ ${left} ข้อ · ` : '') + 'ปิด section นี้แล้วกลับมาแก้ไม่ได้ และเวลาที่เหลือจะไม่ทบไป';
    if (await uiConfirm(msg, {title: 'Save & Proceed?', ok: 'ปิด section'})) hrClose(false);
  };
  bar.appendChild(proceed);
  m.appendChild(bar);
  const tick = () => {
    if (!location.hash.startsWith('#/hr') || ST.hr !== H || H.results) { clearInterval(hrTimer); return; }
    const left = H.deadline - Date.now();
    chip.textContent = hrFmt(left);
    chip.className = 'hr-timer' + (left < 60000 ? ' danger' : left < 3 * 60000 ? ' warn' : '');
    if (left <= 0) { clearInterval(hrTimer); hrClose(true); }
  };
  tick(); hrTimer = setInterval(tick, 1000);
  const body = el('div'); m.appendChild(body);
  if (!sec.kind) hrMcqView(body, S);
  else if (sec.kind === 'sql') hrSqlView(body, S);
  else if (sec.kind === 'prompt') hrPromptView(body, S);
  else hrCodeView(body, S);
  const quit = el('button', 'btn small', 'ยกเลิกการซ้อมนี้'); quit.style.marginTop = '24px';
  quit.onclick = async () => { if (await uiConfirm('ผลของรอบนี้จะไม่ถูกบันทึก', {title: 'ยกเลิกการซ้อม?', ok: 'ยกเลิก', danger: true})) { ST.hr = null; save(); render(); } };
  m.appendChild(quit);
}
function hrMcqView(box, S){
  const nav = el('div', 'hr-nav');
  S.items.forEach((_, i) => {
    const b = el('button', 'hr-num' + (i === S.cur ? ' cur' : '') + (S.ans[i] != null && (!Array.isArray(S.ans[i]) || S.ans[i].length) ? ' done' : '') + (S.marks[i] ? ' mark' : ''), String(i + 1));
    b.onclick = () => { S.cur = i; save(); render(); };
    nav.appendChild(b);
  });
  box.appendChild(nav);
  const q = S.items[S.cur], c = el('div', 'card');
  const head = el('div', 'row'); head.style.justifyContent = 'space-between';
  head.appendChild(el('b', null, `ข้อ ${S.cur + 1} / ${S.items.length}`));
  const mk = el('button', 'btn small', S.marks[S.cur] ? '★ bookmark แล้ว' : '☆ bookmark'); mk.onclick = () => { S.marks[S.cur] = !S.marks[S.cur]; save(); render(); };
  head.appendChild(mk); c.appendChild(head);
  c.appendChild(el('p', 'b', q.q));
  c.appendChild(el('div', 'muted', q.multi ? 'Pick ONE or MORE options' : 'Pick ONE option'));
  q.o.forEach((o, k) => {
    const cur = S.ans[S.cur], on = q.multi ? (cur || []).includes(k) : cur === k;
    const b = el('button', 'opt' + (on ? ' sel' : ''), (q.multi ? (on ? '☑ ' : '☐ ') : '') + o);
    b.onclick = () => {
      if (q.multi) { const a = new Set(S.ans[S.cur] || []); a.has(k) ? a.delete(k) : a.add(k); S.ans[S.cur] = [...a].sort(); }
      else S.ans[S.cur] = k;
      save(); render();
    };
    c.appendChild(b);
  });
  const clear = el('button', 'btn small', 'Clear Selection'); clear.onclick = () => { delete S.ans[S.cur]; save(); render(); };
  const row = el('div', 'row');
  const prev = el('button', 'btn', '‹ ก่อนหน้า'); prev.disabled = S.cur === 0; prev.onclick = () => { S.cur--; save(); render(); };
  const next = el('button', 'btn', 'ถัดไป ›'); next.disabled = S.cur === S.items.length - 1; next.onclick = () => { S.cur++; save(); render(); };
  row.appendChild(prev); row.appendChild(next); row.appendChild(clear);
  c.appendChild(row);
  box.appendChild(c);
}
function hrSqlView(box, S){
  const t = HR_SQL.find(x => x.id === S.task), c = el('div', 'card');
  c.appendChild(el('h2', null, t.title));
  c.appendChild(el('p', 'b', t.desc));
  t.tables.forEach(([name, cols]) => c.appendChild(html('div', 'muted', `<b>${name}</b>: ${cols}`)));
  const peekOut = el('div', 'out');
  const peek = el('button', 'btn small', 'ดูข้อมูลตัวอย่าง');
  peek.onclick = async () => { try { await loadSql(); peekOut.innerHTML = ''; t.tables.forEach(([name]) => { peekOut.appendChild(el('b', null, name)); peekOut.appendChild(tableOf(hrSqlRun(t, `SELECT * FROM ${name};`, t.sample))); }); } catch (e) { peekOut.textContent = '✗ ' + e.message; } };
  c.appendChild(el('div', 'row')).appendChild(peek); c.appendChild(peekOut);
  c.appendChild(el('div', 'muted', 'เขียน query (ปิดท้ายด้วย ;) — ตรวจทั้งค่าและลำดับแถว ทั้งข้อมูลตัวอย่างและชุดซ่อน · ที่นี่รันด้วย SQLite (ใกล้ MySQL) ข้อสอบจริงเลือก mysql/oracle/tsql/postgresql ได้'));
  const ta = el('textarea'); ta.rows = 8; ta.spellcheck = false; ta.value = S.code || '';
  ta.oninput = () => { S.code = ta.value; save(); };
  c.appendChild(ta);
  const out = el('div', 'out'), run = el('button', 'btn green', '▶ Run Query');
  run.onclick = async () => { try { await loadSql(); out.innerHTML = ''; const r = hrSqlRun(t, ta.value, t.sample); out.appendChild(el('div', 'muted', r.values.length + ' แถว (ข้อมูลตัวอย่าง)')); out.appendChild(tableOf(r)); } catch (e) { out.textContent = '✗ ' + e.message; } };
  c.appendChild(el('div', 'row')).appendChild(run); c.appendChild(out);
  box.appendChild(c);
}
function hrPromptView(box, S){
  const t = HR_PROMPT.find(x => x.id === S.task), c = el('div', 'card');
  c.appendChild(el('h2', null, t.title));
  c.appendChild(el('p', 'b', t.desc)).style.whiteSpace = 'pre-wrap';
  c.appendChild(el('b', null, 'Sample Input')); c.appendChild(el('pre', null, t.cases[0].input));
  c.appendChild(el('b', null, 'Sample Output')); c.appendChild(el('pre', null, t.cases[0].output));
  c.appendChild(el('div', 'muted', '{testcase input} จะถูกแทนด้วยข้อมูลแต่ละเคส'));
  const pa = el('textarea', 'prompt'); pa.value = S.prompt; pa.placeholder = 'Write your prompt here...';
  const info = el('div', 'muted');
  const upd = () => { const p = hrPromptIssue(pa.value); info.textContent = p || '✓ prompt พร้อมใช้'; info.className = p ? 'warn' : 'pass'; };
  pa.oninput = () => { S.prompt = pa.value; save(); upd(); }; upd();
  c.appendChild(pa); c.appendChild(info);
  c.appendChild(el('h3', null, 'Test Results — คัดลอก prompt ของแต่ละเคสไปถาม AI (แชตใหม่) แล้ววางคำตอบกลับ'));
  t.cases.forEach((cs, i) => {
    const w = el('div', 'q');
    const row = el('div', 'row'); row.appendChild(el('b', null, `Test Case ${i + 1}`));
    const cp = el('button', 'btn small', 'คัดลอก prompt'); cp.onclick = () => { const p = hrPromptIssue(pa.value); if (p) { uiAlert(p); return; } copyText(pa.value.replace('{testcase input}', cs.input), cp); };
    row.appendChild(cp); const st = el('span'); row.appendChild(st); w.appendChild(row);
    const ans = el('textarea'); ans.rows = 2; ans.placeholder = 'วางคำตอบของ AI'; ans.value = S.caseOut[i] || '';
    const check = () => { const v = ans.value.trim(); st.className = !v ? 'muted' : v === cs.output ? 'pass' : 'fail'; st.textContent = !v ? '' : v === cs.output ? '✓ ตรง' : '✗ ไม่ตรง (expected ' + cs.output + ')'; };
    ans.oninput = () => { S.caseOut[i] = ans.value; save(); check(); }; check();
    w.appendChild(ans); c.appendChild(w);
  });
  box.appendChild(c);
}
function hrCodeView(box, S){
  const p = PROBLEMS.find(x => x.id === S.task), c = el('div', 'card');
  c.appendChild(el('h2', null, p.title));
  c.appendChild(el('p', 'b', p.desc)).style.whiteSpace = 'pre-wrap';
  c.appendChild(el('div', 'muted', 'เขียนเป็น JavaScript — ข้อสอบจริง (Q57) เลือก javascript ได้เหมือนกัน (มีให้เลือก 22 ภาษา รวม csharp)'));
  const ta = el('textarea'); ta.rows = 14; ta.spellcheck = false; ta.value = S.code == null ? p.starter : S.code;
  ta.oninput = () => { S.code = ta.value; save(); };
  c.appendChild(ta);
  const out = el('div', 'out'), run = el('button', 'btn green', '▶ Run Code (sample tests)');
  run.onclick = async () => { out.textContent = 'กำลังรัน...'; const tests = p.tests.filter(t => !t.gen).slice(0, 3); showResult(out, await runJs(ta.value, p.fn, tests), tests); };
  c.appendChild(el('div', 'row')).appendChild(run);
  c.appendChild(el('div', 'muted', 'มี hidden test และ performance test ตรวจตอนปิด section'));
  c.appendChild(out);
  box.appendChild(c);
}
function hrResultView(m, H){
  m.appendChild(el('h1', null, 'ผลการจำลอง HackerRank'));
  const c = el('div', 'card');
  const t = el('table'); t.innerHTML = '<tr><th>Section</th><th>คะแนน</th><th>เวลาที่ใช้</th></tr>';
  let sumOk = 0, sumN = 0;
  H.order.forEach(i => {
    const s = HR_SECTIONS[i], S = H.secs[s.id], g = S.grade;
    if (!s.kind) { sumOk += g.ok; sumN += g.n; }
    const tr = el('tr');
    tr.appendChild(el('td', null, s.name));
    tr.appendChild(el('td', g.pct >= 70 ? 'pass' : g.pct >= 50 ? 'warn' : 'fail', s.kind ? `${g.pct}% · ${g.note}` : `${g.ok}/${g.n} (${g.pct}%)`));
    tr.appendChild(el('td', null, `${Math.round(S.used / 60000)} / ${s.min} นาที`));
    t.appendChild(tr);
  });
  const tw = el('div', 'tw'); tw.appendChild(t); c.appendChild(tw);
  if (sumN) c.appendChild(el('p', 'b', `ปรนัยรวม ${sumOk}/${sumN} (${Math.round(sumOk / sumN * 100)}%) — เป้าหมาย Lead ต้องได้ ≥ 50% ทุกทักษะ และ ≥ 70% ใน Web/API`));
  const again = el('button', 'btn primary', 'กลับหน้าซ้อม'); again.onclick = () => { ST.hr = null; save(); render(); };
  c.appendChild(again);
  m.appendChild(c);
  m.appendChild(el('div', 'section-label', 'เฉลยและสิ่งที่ควรทบทวน'));
  H.order.forEach(i => {
    const s = HR_SECTIONS[i], S = H.secs[s.id], d = el('details', 'fold');
    d.appendChild(el('summary', null, `${s.name} — ${S.grade.pct}%`));
    const inner = el('div', 'inner'); d.appendChild(inner);
    if (!s.kind) {
      S.items.forEach((q, k) => {
        const ok = hrMcqOk(q, S.ans[k]); if (ok) return;
        const w = el('div', 'q');
        w.appendChild(el('div', 'qt', `${k + 1}. ${q.q}`));
        const ans = Array.isArray(q.a) ? q.a : [q.a], mine = S.ans[k] == null ? [] : [].concat(S.ans[k]);
        q.o.forEach((o, j) => w.appendChild(el('div', 'opt' + (ans.includes(j) ? ' correct' : mine.includes(j) ? ' wrong' : ''), o)));
        if (q.e) w.appendChild(el('div', 'explain', q.e));
        const l = lessonById(q.lid); if (l) { const a = el('a', 'btn small', 'ทบทวนบท ' + (CHIP[q.lid] || shortTitle(l))); a.href = '#/lesson/' + q.lid; w.appendChild(a); }
        inner.appendChild(w);
      });
      if (S.grade.ok === S.grade.n) inner.appendChild(el('p', 'pass', 'ถูกทุกข้อ'));
    } else if (s.kind === 'sql') {
      const tk = HR_SQL.find(x => x.id === S.task);
      inner.appendChild(el('p', 'muted', tk.tip)); inner.appendChild(el('div', 'muted', 'เฉลย:')); inner.appendChild(el('pre', null, tk.ref));
    } else if (s.kind === 'prompt') {
      const tk = HR_PROMPT.find(x => x.id === S.task);
      inner.appendChild(el('div', 'muted', 'ตัวอย่าง prompt ที่ดี:')); inner.appendChild(el('pre', null, tk.sample));
    } else {
      const p = PROBLEMS.find(x => x.id === S.task);
      inner.appendChild(el('p', 'muted', p.hint)); inner.appendChild(reveal('เฉลย JavaScript', p.sol)); inner.appendChild(reveal('เฉลย C#', p.cs));
    }
    m.appendChild(d);
  });
}


render();
if (IN_APP) sendSchedule();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
